<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — Isochronic Tone Generator</title>
<style>
  :root {
    --ink: #0d1024;
    --ink-2: #151a36;
    --mist: #b9c0e4;
    --bright: #eef0ff;
    --glow: #ffb27d;
    --glow-soft: rgba(255, 178, 125, 0.35);
    --violet: #8f7ff0;
    --line: rgba(185, 192, 228, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: radial-gradient(120% 90% at 50% 0%, #1a2048 0%, var(--ink) 55%);
    color: var(--bright);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
    padding: 28px 20px 48px;
  }

  header { text-align: center; margin-bottom: 8px; }

  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--mist);
  }

  .band-readout {
    margin-top: 6px;
    font-size: 13px;
    color: var(--violet);
    letter-spacing: 0.08em;
    min-height: 18px;
    transition: color 0.4s;
  }

  /* ---------- The orb ---------- */
  .orb-stage {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 18px 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .orb-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
  }

  .orb {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #ffd9b8 0%, var(--glow) 35%, #d96f3f 100%);
    box-shadow: 0 0 60px var(--glow-soft), 0 0 120px rgba(143, 127, 240, 0.15);
    opacity: 0.25;
    transform: scale(0.9);
    cursor: pointer;
    border: none;
    outline-offset: 8px;
    transition: opacity 0.05s linear, transform 0.05s linear;
  }
  .orb:focus-visible { outline: 2px solid var(--violet); }

  .orb-hint {
    position: absolute;
    bottom: -6px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mist);
    pointer-events: none;
  }

  /* ---------- Controls ---------- */
  .panel {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    margin-top: 26px;
  }

  .control label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mist);
    margin-bottom: 10px;
  }

  .control .value {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--bright);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 30px;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px;
    background: linear-gradient(90deg, var(--violet), var(--glow));
    border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bright);
    border: 3px solid var(--ink);
    box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0,0,0,0.5);
    margin-top: -10px;
  }
  input[type="range"]::-moz-range-track {
    height: 3px;
    background: linear-gradient(90deg, var(--violet), var(--glow));
    border-radius: 2px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--bright);
    border: 3px solid var(--ink);
    box-shadow: 0 0 0 1px var(--line);
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--violet); outline-offset: 4px; border-radius: 6px; }

  .band-scale {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(185, 192, 228, 0.45);
    margin-top: 2px;
    user-select: none;
  }
  .band-scale span.active { color: var(--glow); }

  .play-row {
    display: flex;
    justify-content: center;
    margin-top: 6px;
  }

  .play-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--bright);
    border: none;
    border-radius: 999px;
    padding: 14px 44px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .play-btn:hover { background: #ffffff; }
  .play-btn:active { transform: scale(0.97); }
  .play-btn.playing {
    background: transparent;
    color: var(--bright);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .play-btn:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }

  .bg-note {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: rgba(185, 192, 228, 0.5);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .orb { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Pulse</h1>
  <div class="band-readout" id="bandReadout"></div>
</header>

<div class="orb-stage">
  <div class="orb-ring"></div>
  <button class="orb" id="orb" aria-label="Start or stop tone"></button>
  <div class="orb-hint" id="orbHint">tap to begin</div>
</div>

<div class="panel">

  <div class="control">
    <label for="pitch">Pitch <span class="value" id="pitchVal">180 Hz</span></label>
    <input type="range" id="pitch" min="40" max="880" step="1" value="180" aria-label="Carrier pitch in hertz">
  </div>

  <div class="control">
    <label for="rate">Beat rate <span class="value" id="rateVal">10.0 Hz</span></label>
    <input type="range" id="rate" min="0.5" max="40" step="0.5" value="10" aria-label="Pulses per second">
    <div class="band-scale" id="bandScale">
      <span data-band="delta">Delta</span>
      <span data-band="theta">Theta</span>
      <span data-band="alpha">Alpha</span>
      <span data-band="beta">Beta</span>
      <span data-band="gamma">Gamma</span>
    </div>
  </div>

  <div class="control">
    <label for="volume">Volume <span class="value" id="volVal">50%</span></label>
    <input type="range" id="volume" min="0" max="100" step="1" value="50" aria-label="Volume percent">
  </div>

  <div class="play-row">
    <button class="play-btn" id="playBtn">Play</button>
  </div>

  <div class="bg-note" id="bgNote" hidden>Audio keeps playing with the screen off — stop it here or from the notification.</div>

</div>

<script>
(function () {
  // ---------- Native bridge (Android app) or WebAudio (browser) ----------
  const native = window.PulseNative || null;

  // ---------- Shared state ----------
  let playing = false;

  // ---------- DOM ----------
  const pitchSlider = document.getElementById('pitch');
  const rateSlider  = document.getElementById('rate');
  const volSlider   = document.getElementById('volume');
  const pitchVal    = document.getElementById('pitchVal');
  const rateVal     = document.getElementById('rateVal');
  const volVal      = document.getElementById('volVal');
  const playBtn     = document.getElementById('playBtn');
  const orb         = document.getElementById('orb');
  const orbHint     = document.getElementById('orbHint');
  const bandReadout = document.getElementById('bandReadout');
  const bandSpans   = document.querySelectorAll('#bandScale span');
  const bgNote      = document.getElementById('bgNote');

  if (native) bgNote.hidden = false;

  const params = {
    pitch: () => parseFloat(pitchSlider.value),
    rate:  () => parseFloat(rateSlider.value),
    vol:   () => parseInt(volSlider.value, 10) / 100
  };

  // ---------- Brainwave bands ----------
  function bandFor(hz) {
    if (hz < 4)  return { key: 'delta', label: 'Delta · deep sleep range' };
    if (hz < 8)  return { key: 'theta', label: 'Theta · drowsy / meditative range' };
    if (hz < 13) return { key: 'alpha', label: 'Alpha · relaxed / calm-focus range' };
    if (hz < 30) return { key: 'beta',  label: 'Beta · alert / active range' };
    return { key: 'gamma', label: 'Gamma · high-frequency range' };
  }

  function updateBandUI() {
    const band = bandFor(params.rate());
    bandReadout.textContent = band.label;
    bandSpans.forEach(s => s.classList.toggle('active', s.dataset.band === band.key));
  }

  // ---------- UI state ----------
  function setPlayingUI(isPlaying) {
    playing = isPlaying;
    playBtn.textContent = isPlaying ? 'Stop' : 'Play';
    playBtn.classList.toggle('playing', isPlaying);
    orbHint.textContent = isPlaying ? 'tap to stop' : 'tap to begin';
    if (!isPlaying) {
      orb.style.opacity = 0.25;
      orb.style.transform = 'scale(0.9)';
    }
  }

  // =====================================================================
  // NATIVE MODE — synthesis happens in the Kotlin foreground service.
  // The page only drives UI and keeps the orb visually in phase.
  // =====================================================================
  let visAnchor = 0;       // performance.now() ms of a pulse-cycle start
  let visRate = 10;

  function nativeStart() {
    native.startTone(params.pitch(), params.rate(), params.vol());
    visRate = params.rate();
    visAnchor = performance.now();
    setPlayingUI(true);
    requestAnimationFrame(nativeDraw);
  }

  function nativeStop() {
    native.stopTone();
    setPlayingUI(false);
  }

  function nativeDraw() {
    if (!playing) return;
    const frac = (((performance.now() - visAnchor) / 1000) * visRate) % 1;
    const lit = frac < 0.5;
    orb.style.opacity = lit ? 1 : 0.3;
    orb.style.transform = lit ? 'scale(1)' : 'scale(0.92)';
    requestAnimationFrame(nativeDraw);
  }

  // Keep the visual phase continuous when the rate slider moves.
  function nativeRetimeVisual(newRate) {
    const now = performance.now();
    const frac = (((now - visAnchor) / 1000) * visRate) % 1;
    visAnchor = now - (frac / newRate) * 1000;
    visRate = newRate;
  }

  // Called from Kotlin when playback stops (e.g. notification Stop button, audio focus loss).
  window.__pulseNativeStopped = function () { setPlayingUI(false); };

  // Called from Kotlin when the activity reconnects to a running (or stopped) service.
  window.__pulseSyncState = function (isPlaying) {
    if (isPlaying && !playing) {
      visRate = params.rate();
      visAnchor = performance.now();
      setPlayingUI(true);
      requestAnimationFrame(nativeDraw);
    } else if (!isPlaying && playing) {
      setPlayingUI(false);
    }
  };

  // =====================================================================
  // WEB MODE — full WebAudio implementation (used when opened in a browser).
  // =====================================================================
  let ctx = null, osc = null, gateGain = null, masterGain = null;
  let nextPulseTime = 0, schedulerTimer = null, pulseQueue = [];
  const LOOKAHEAD_MS = 25, SCHEDULE_AHEAD = 0.12, RAMP = 0.005;

  function volumeGain() { const v = params.vol(); return v * v * 0.5; }

  function webStart() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();

    osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = params.pitch();

    gateGain = ctx.createGain();
    gateGain.gain.value = 0;

    masterGain = ctx.createGain();
    masterGain.gain.value = volumeGain();

    osc.connect(gateGain).connect(masterGain).connect(ctx.destination);
    osc.start();

    nextPulseTime = ctx.currentTime + 0.05;
    pulseQueue = [];
    schedulerTimer = setInterval(webSchedule, LOOKAHEAD_MS);

    setPlayingUI(true);
    requestAnimationFrame(webDraw);
  }

  function webStop() {
    clearInterval(schedulerTimer);
    schedulerTimer = null;
    if (osc) {
      const t = ctx.currentTime;
      masterGain.gain.cancelScheduledValues(t);
      masterGain.gain.setValueAtTime(masterGain.gain.value, t);
      masterGain.gain.linearRampToValueAtTime(0, t + 0.05);
      osc.stop(t + 0.08);
      osc = null; gateGain = null; masterGain = null;
    }
    pulseQueue = [];
    setPlayingUI(false);
  }

  function webSchedule() {
    const rate = params.rate();
    const period = 1 / rate;
    const onTime = period * 0.5;

    while (nextPulseTime < ctx.currentTime + SCHEDULE_AHEAD) {
      const g = gateGain.gain;
      const t = nextPulseTime;
      const rampUpEnd = t + RAMP;
      const rampDownStart = Math.max(rampUpEnd, t + onTime - RAMP);

      g.setValueAtTime(0, t);
      g.linearRampToValueAtTime(1, rampUpEnd);
      g.setValueAtTime(1, rampDownStart);
      g.linearRampToValueAtTime(0, t + onTime);

      pulseQueue.push({ time: t, duration: onTime });
      nextPulseTime += period;
    }
  }

  function webDraw() {
    if (!playing) return;
    const now = ctx.currentTime;
    while (pulseQueue.length && pulseQueue[0].time + pulseQueue[0].duration < now) pulseQueue.shift();
    const lit = pulseQueue.length && pulseQueue[0].time <= now;
    orb.style.opacity = lit ? 1 : 0.3;
    orb.style.transform = lit ? 'scale(1)' : 'scale(0.92)';
    requestAnimationFrame(webDraw);
  }

  // =====================================================================
  // Wiring
  // =====================================================================
  function start() { native ? nativeStart() : webStart(); }
  function stop()  { native ? nativeStop()  : webStop(); }
  function toggle() { playing ? stop() : start(); }

  pitchSlider.addEventListener('input', () => {
    pitchVal.textContent = pitchSlider.value + ' Hz';
    if (native) native.setPitch(params.pitch());
    else if (osc) osc.frequency.setTargetAtTime(params.pitch(), ctx.currentTime, 0.02);
  });

  rateSlider.addEventListener('input', () => {
    const r = params.rate();
    rateVal.textContent = r.toFixed(1) + ' Hz';
    updateBandUI();
    if (native) {
      native.setRate(r);
      if (playing) nativeRetimeVisual(r);
    }
    // Web mode: the scheduler picks up the new rate automatically.
  });

  volSlider.addEventListener('input', () => {
    volVal.textContent = volSlider.value + '%';
    if (native) native.setVolume(params.vol());
    else if (masterGain) masterGain.gain.setTargetAtTime(volumeGain(), ctx.currentTime, 0.02);
  });

  playBtn.addEventListener('click', toggle);
  orb.addEventListener('click', toggle);

  // Legacy hook, kept harmless.
  window.__pulseStop = function () { if (playing && !native) stop(); };

  updateBandUI();
})();
</script>

</body>
</html>
